<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Hours Schedule</title>
  <link rel="stylesheet" href="./CSS/officeHours.css">
</head>
<body>
  <table>
    <tr>
      <td id="blank"></td>
      <th class="nonBlank">Monday</th>
      <th class="nonBlank">Tuesday</th>
      <th class="nonBlank">Wednesday</th>
      <th class="nonBlank">Thursday</th>
      <th class="nonBlank">Friday</th>
    </tr>
    <tbody>
      <tr>
        <th scope="row">9:00-11:00</th>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
      </tr>
      <tr>
        <th scope="row">11:00-12:00</th>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Open</td>
      </tr>
      <tr>
        <th scope="row">12:00-14:00</th>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
      </tr>
      <tr>
        <th scope="row">14:00-16:00</td>
        <td class="uL">Open</td>
        <td class="uL">Open</td>
        <td class="uL">Open</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
      </tr>
      <tr>
        <th scope="row">16:00-18:00</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
        <td class="uL">Open</td>
        <td class="uL">Closed</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
