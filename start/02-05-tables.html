<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
</head>
<!--NOTES: Table - set of data displayed as a series of rows/columns.
table>thead>tr>th*4, tab, creates:
  <table>
    <thead>
      <tr>
        <th></th>
        <th></th>
        <th></th>
        <th></th>
      </tr>
    </thead>
  </table>

  tbody>tr>td*4, tab, creates: 
  <tbody>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </tbody>

  You can then copy and paste:
  <tr>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
  </tr>

  Into the appropiate place twice more to quickly make the whole table.

-->
<body>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Age</th>
        <th>Owner</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Sparky</td>
        <td>Dog</td>
        <td>4</td>
        <td>M-Slaughter</td>
      </tr>
      <tr>
        <td>Lulu</td>
        <td>Rabbit</td>
        <td>2</td>
        <td>Koji</td>
      </tr>
      <tr>
        <td>Cheeto</td>
        <td>Lizard</td>
        <td>15</td>
        <td>The b3hr</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
