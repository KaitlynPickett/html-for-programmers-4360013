<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Non-Semantic Elements</title>
</head>
<!--NOTES: <div> and <span> are generic containers that allow you to logically group content.
<div> used for block-level grouping.
<span> used for inline-level grouping.
You should only use <div> and <span> when there isn't a semantic element that accurately represents the content or when you want to create a logical grouping.-->
<body>
  <div>
    <img src="../assets/richard-klein.png" alt="Richard Klein avatar">
    <h3>Richard Klein</h3>
    <p>Gothenburg, <span style="color: blueviolet;">Sweden</span></p>
    <button>Add Friend</button>
  </div>
  
  <div>
    <img src="../assets/ella-northridge.png" alt="Ella Northridge avatar">
    <h3>Ella Northridge</h3>
    <p>Karlsruhe, <span style="color: blueviolet;">Germany</span></p>
    <button>Add Friend</button>
  </div>

  <div>
    <img src="../assets/samson-brown.png" alt="Samson Brown avatar">
    <h3>Samson Brown</h3>
    <p>Red Hook, <span style="color: blueviolet;">USA</span></p>
    <button>Add Friend</button>
  </div>
</body>

</html>
