<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Content</title>
</head>

<body>
  <!--NOTES: Make sure ALT tags are visually descriptive; they are read by screen readers to the visually impaired.
  The SRCSET attribute allows you to include one or more strings that indicate potential image sources. If user is on low bandwidth, they can receive more compressed img files.
-->
  <!-- Images -->
  <img src="../assets/beach.png" alt="Beach at sunset with a dark pier.">
  <img src="https://explorecalifornia.org/_images/mission_look.jpg" alt="Person stands on rocky shoreline staring out at ocean.">
  <!-- Audio -->
  <span>
    <button type="button">Play Me<audio src="../assets/chill-out.mp3" controls></audio>To Chill</button>
  <!-- <audio src="../assets/chill-out.mp3" controls></audio> -->
  <!-- Video -->
  <video width="450" height="275" controls>
    <source src="../assets/writing-in-a-journal.mp4" type="video/mp4">
    Your browser does not support this video tag.
  </video>
</body>

</html>
