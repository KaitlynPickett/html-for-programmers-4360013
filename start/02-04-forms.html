<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>
<!--NOTES: Forms take a few attributes. The most common are ACTION and METHOD. 
  The ACTION attribute takes the URL that will process the form for submission.
The METHOD attribute defines the HTTP method the form will be submitted with.
For phone numbers set the input type to "tel".-->
  <form action="" method="post">
    <label for="full-name">Full Name: </label>
    <input type="text" id="full-name" placeholder="Quicksilver">
    <br>
    <label for="email">Email: </label>
    <input type="email" id="email" placeholder="user@email.com">
    <br>
    <label for="phone">Phone Number: </label>
    <input type="tel" id="phone" placeholder="(123)-456-7890">
    <br>
    <label for="date">Date: </label>
    <input type="date" id="date">
    <br>
    <label for="guests">Number of Guests: </label>
    <select name="guests" id="guests">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <br>
   <!-- select>opt*4, then tab creates:
    <select name="" id="">
      <option value=""></option>
      <option value=""></option>
      <option value=""></option>
      <option value=""></option>
    </select>-->
    <button type="submit">Submit</button>
  </form>
<body>
</body>

</html>
