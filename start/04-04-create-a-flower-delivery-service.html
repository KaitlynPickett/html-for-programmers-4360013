<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create A Flower Delivery Service</title>
</head>

<body>
  <form action="">
    <!--contact section-->
    <div></div>
    <!--receipient details-->
      <div>
        <h2>Recipient Details</h2>
        <label for="recipientName">Full Name</label>
        <br>
        <input type="text" id="recipientName" placeholder="Jane Doe">
        <br>
        <label for="phoneNumber">Phone Number</label>
        <br>
        <input type="tel" id="phoneNumber" placeholder="(123)-456-7890">
        <br>
        <label for="address">Address</label>
        <br>
        <input type="text" id="address" placeholder="123 First Street, Town, State, ZIP">
      </div>
    <!--sender details-->
      <div>
        <h2>Sender Details</h2>
        <label for="senderName">Full Name</label>
        <br>
        <input type="text" id="senderName" placeholder="John Doe">
        <br>
        <label for="email">E-mail Address</label>
        <br>
        <input type="email" id="email" placeholder="user@email.com">
      </div>
    <!--order section-->
    <div>
      <h2>Order</h2>
      <label for="bouquetType">Bouquet Type</label>
      <br>
      <select name="bouquetType" id="bouquetSelect">
        <option value="basic-bouquet">Basic Bouquet - $24.99</option>
        <option value="premiumBouquet">Premium Bouquet - $49.99</option>
        <option value="premiumChocolate">Premium Bouquet + Chocolate - $69.99</option>
      </select>
      <br>
      <label for="message">Message</label>
      <br>
      <textarea id="message" name="message" rows="5" cols="35">Your message here</textarea>
      <br>
      <button type="submit">Checkout</button>
    </div>
  </form>
</body>

</html>
